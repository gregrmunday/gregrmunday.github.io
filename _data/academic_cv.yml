  - id: positions
    title: Positions
    entries:
      - title: DPhil researcher
        organisation: University of Oxford
        dates: Oct 2025–present
        summary: >-
          Hybrid physics and AI parameterisations for SpeedyWeather.jl with
          Milan Klöwer and Laura Mansfield, focusing on online learning,
          physical constraints and generalisation. Continued development
          of ProFSea-Climate and contributions to sea-level emulator intercomparison.

      - title: Applied Climate Scientist / Project Scientist
        organisation: Met Office
        dates: Feb 2022–Oct 2025
        summary: >-
          Climate emulation, ecosystem impacts, sea-level projections and
          flood attribution, alongside machine learning for lightning
          prediction and climate-model downscaling.
        highlights:
          - "Lead author: ecosystem risks under overshoot (Nature Climate Change, 2025); co-author of the PRIME climate emulator paper (GMD, 2025)."
          - "Led sea-level emulator development and COMPASS flood attribution analysis; mentored junior colleagues and delivered scientific software and training."

      - title: Product Lead
        organisation: i24
        dates: Mar 2021–Jan 2022
        summary: >-
          FinTech app design and development with React and React Native;
          business analytics, financial projections and pitch development.

      - title: Student Ambassador
        organisation: University of Exeter
        dates: Jan 2019–Aug 2020
        summary: University outreach, particularly for prospective students from low-income backgrounds.


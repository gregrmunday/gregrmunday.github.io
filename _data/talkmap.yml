# The map uses your existing _talks files, plus extra presentations below.
# Add a location here when adding a talk in a new city. Match the location
# text in the talk's front matter exactly. Coordinates are city centres.
locations:
  - name: Vienna, Austria
    latitude: 48.2084
    longitude: 16.3725
  - name: Chicago, USA
    latitude: 41.8781
    longitude: -87.6298
  - name: San Francisco, USA
    latitude: 37.7749
    longitude: -122.4194
  - name: Utrecht, Netherlands
    latitude: 52.0907
    longitude: 5.1214

# Exclude co-authored work you did not personally present, using its permalink.
exclude_talks: []
# Example:
# exclude_talks:
#   - /talks/2025-03-18-prime

# Add presentations without creating a separate talk page here. Keep newest
# first. A missing location or unknown coordinates still leaves a visible entry
# in the list; the map never guesses a city.
presentations:
  - title: Multi-century sea-level projections and human impacts under the indicative ScenarioMIP-CMIP7 forcings
    venue: EGU General Assembly 2026
    year: "2026"
    type: Conference presentation
    location: Vienna, Austria
    abstract_id: EGU26-18937
    author_role: presenter # Gregory presented this co-authored ProFSea contribution.
    url: https://doi.org/10.5194/egusphere-egu26-18937
    source: https://scholar.google.com/citations?view_op=view_citation&user=xtzdb1IAAAAJ&citation_for_view=xtzdb1IAAAAJ:5nxA0vEk-isC

  # These talks are listed on Gregory's Google Scholar profile but not ORCID.
  # Only the publication month is recorded, so no exact talk day is inferred.
  - title: "Showcasing PRIME: Probabilistic Regional Impacts from Model patterns and Emissions"

# Titles, years, abstracts and links come from _data/publications.json on BOTH
# pages. This file contains only information ORCID/Scholar cannot reliably tell us.
include_all_conferences: true

# Add coordinates once per city; unknown locations remain in the list.
locations:
  - name: Vienna, Austria
    latitude: 48.2084
    longitude: 16.3725
  - name: Chicago, USA
    latitude: 41.8781
    longitude: -87.6298
  - name: San Francisco, USA
    latitude: 37.7749
    longitude: -122.4194
  - name: Washington, DC, USA
    latitude: 38.9072
    longitude: -77.0369
  - name: Utrecht, Netherlands
    latitude: 52.0907
    longitude: 5.1214

# Meeting names match the merged bibliography's venue. Add each new meeting here
# once, rather than repeating its location for every abstract.
meetings:
  EGU 2024:
    location: Vienna, Austria
  EGU 2025:
    location: Vienna, Austria
  EGU 2026:
    location: Vienna, Austria
    source: https://www.egu26.eu/attendance/venue.html
  EMS 2026:
    location: Utrecht, Netherlands
    source: https://www.emetsoc.org/ems-annual-meeting-2026-programme-is-live/
  AGU 2022:
    location: Chicago, USA
  AGU 2023:
    location: San Francisco, USA
  AGU 2024:
    location: Washington, DC, USA
    source: https://www.agu.org/annual-meeting-2024/press

# Stable keys: DOI if present, otherwise "venue:abstract_id".
# presented_by_gregory: true makes a co-authored contribution green while keeping
# its actual author order. show_on_map is used if include_all_conferences is false.
# Optional fields: type, location, author_role (first-author/co-author/unknown),
# author_position (a confirmed numeric position in the author list).
overrides:
  "10.5194/ems2026-226":
    author_role: co-author
    author_position: 2
  "AGU 2022:GC26E-04":
    presented_by_gregory: true
    show_on_map: true
    type: Conference talk
  "AGU 2023:GC23D-04":
    presented_by_gregory: true
    show_on_map: true
    type: Conference talk
  "AGU 2024:B41E-02":
    author_role: co-author
    show_on_map: true
    type: Conference talk
  "10.5194/egusphere-egu26-18937":
    presented_by_gregory: true
    show_on_map: true
    type: Conference presentation
  "10.5194/egusphere-egu25-14775":
    show_on_map: true
    type: Conference poster
  "10.5194/egusphere-egu25-11014":
    show_on_map: true
    type: Conference poster
  "10.5194/egusphere-egu25-11574":
    show_on_map: true
    type: Conference poster
  "10.5194/egusphere-egu25-18398":
    show_on_map: true
    type: Conference poster
